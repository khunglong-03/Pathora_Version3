# ───────────────────────────────────────────────────────────
# Pathora Nginx Reverse Proxy
# ───────────────────────────────────────────────────────────
# Upstream routing:
#   publicapi  → Public-facing endpoints (no auth required)
#   backend    → Private/dashboard endpoints (auth required)
#   frontend   → Next.js SSR application
# ───────────────────────────────────────────────────────────

map $http_x_forwarded_proto $pathora_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

upstream backend_upstream {
    server backend:8080;
}

upstream publicapi_upstream {
    server publicapi:8081;
}

upstream frontend_upstream {
    server frontend:3003;
}

server {
    listen 80;
    server_name localhost;

    # Tour create/update submits multipart FormData with thumbnail + gallery images.
    # Nginx defaults to 1m, which rejects valid tour payloads before Api receives them.
    client_max_body_size 100m;

    # ── Global proxy headers ──────────────────────────────
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $pathora_forwarded_proto;
    proxy_set_header X-Forwarded-Host  $host;

    # ── Health-check endpoints per upstream ────────────────
    location /health/api {
        proxy_pass http://backend_upstream/health;
    }

    location /health/public {
        proxy_pass http://publicapi_upstream/health;
    }

    # ══════════════════════════════════════════════════════
    #  PublicApi routes (public, no JWT required)
    # ══════════════════════════════════════════════════════

    # Public content endpoints
    location /api/public/ {
        proxy_pass http://publicapi_upstream;
    }

    # Authentication (login, register, forgot-password…)
    # Auth endpoints live in the private backend (AuthController), not publicapi.
    location /api/auth/ {
        proxy_pass http://backend_upstream;
    }

    # ASP.NET Google OAuth middleware receives the provider callback here before
    # redirecting to /api/auth/google-callback.
    location /signin-google {
        proxy_pass http://backend_upstream;
    }

    # Payment & webhook endpoints
    location /api/payment/ {
        proxy_pass http://publicapi_upstream;
    }

    # Site-content — admin paths always → backend (auth required)
    location ^~ /api/site-content/admin {
        proxy_pass http://backend_upstream;
    }

    # Site-content read/write — method-split
    #   GET   → publicapi (anonymous read)
    #   PUT/POST/DELETE → backend (admin write, JWT)
    location /api/site-content/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  $http_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Max-Age 86400 always;
            return 204;
        }
        if ($request_method = GET) {
            proxy_pass http://publicapi_upstream;
        }
        if ($request_method !~ ^(GET|OPTIONS)$) {
            proxy_pass http://backend_upstream;
        }
    }

    # ══════════════════════════════════════════════════════
    #  Policy endpoints — method-split routing
    #  GET (anonymous landing /policies) → publicapi
    #  POST/PUT/DELETE (admin dashboard)  → backend
    # ══════════════════════════════════════════════════════

    location = /api/cancellation-policies {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  $http_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Max-Age 86400 always;
            return 204;
        }
        if ($request_method = GET) {
            rewrite ^ /api/public/cancellation-policies break;
            proxy_pass http://publicapi_upstream;
        }
        if ($request_method !~ ^(GET|OPTIONS)$) {
            proxy_pass http://backend_upstream;
        }
    }

    location = /api/deposit-policies {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  $http_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Max-Age 86400 always;
            return 204;
        }
        if ($request_method = GET) {
            rewrite ^ /api/public/deposit-policies break;
            proxy_pass http://publicapi_upstream;
        }
        if ($request_method !~ ^(GET|OPTIONS)$) {
            proxy_pass http://backend_upstream;
        }
    }

    location = /api/pricing-policies {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  $http_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Max-Age 86400 always;
            return 204;
        }
        if ($request_method = GET) {
            rewrite ^ /api/public/pricing-policies break;
            proxy_pass http://publicapi_upstream;
        }
        if ($request_method !~ ^(GET|OPTIONS)$) {
            proxy_pass http://backend_upstream;
        }
    }

    # ══════════════════════════════════════════════════════
    #  Backend Api routes (private, JWT required)
    # ══════════════════════════════════════════════════════

    # Customer-facing private endpoints
    location /api/customer/ {
        proxy_pass http://backend_upstream;
    }

    # SignalR / WebSocket hub — needs upgrade headers
    location /api/hubs/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    # Catch-all for remaining /api/* → private backend
    location /api/ {
        proxy_pass http://backend_upstream;
    }

    # ══════════════════════════════════════════════════════
    #  Frontend (Next.js)
    # ══════════════════════════════════════════════════════
    location /transport {
        proxy_pass http://frontend_upstream;
    }

    location /hotel-provider {
        proxy_pass http://frontend_upstream;
    }

    location / {
        proxy_pass http://frontend_upstream;
    }
}
