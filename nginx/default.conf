# ───────────────────────────────────────────────────────────
# Pathora Nginx Reverse Proxy — single ingress
# ───────────────────────────────────────────────────────────
# Global directives (rate-limit, gzip, log format) live in
# /etc/nginx/conf.d/security.conf (loaded by main nginx.conf).
#
# Upstream routing:
#   publicapi  → Public-facing endpoints (no auth required)
#   backend    → Private/dashboard endpoints (auth required)
#   frontend   → Next.js SSR application
# ───────────────────────────────────────────────────────────

map $http_x_forwarded_proto $pathora_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

upstream backend_upstream {
    server backend:8080;
}

upstream publicapi_upstream {
    server publicapi:8081;
}

upstream frontend_upstream {
    server frontend:3003;
}

# Reusable CORS preflight response — call inside `if ($request_method = OPTIONS)`.
# Returns 204 with permissive headers for dev/cross-origin clients.
# In production with same-origin frontend, the browser never sends preflight.

server {
    listen 8080;
    server_name localhost;

    # Tour create/update submits multipart FormData with thumbnail + gallery images.
    # Nginx defaults to 1m, which rejects valid tour payloads before Api receives them.
    client_max_body_size 100m;

    # JSON access log (format defined in conf.d/security.conf). Re-enabled at
    # server level because security.conf turns off the http-level default.
    access_log /dev/stdout json_combined;

    # ── Global proxy headers ──────────────────────────────
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $pathora_forwarded_proto;
    proxy_set_header X-Forwarded-Host  $host;

    # ── Health-check endpoints per upstream (use real liveness probe) ─────
    location = /health/api {
        access_log off;
        proxy_pass http://backend_upstream/health/live;
    }

    location = /health/public {
        access_log off;
        proxy_pass http://publicapi_upstream/health/live;
    }

    # ══════════════════════════════════════════════════════
    #  PublicApi routes (public, no JWT required)
    # ══════════════════════════════════════════════════════

    # Public content endpoints
    location /api/public/ {
        proxy_pass http://publicapi_upstream;
    }

    # Authentication (login, register, forgot-password…)
    # Rate-limited: 10 req/s per IP, burst 20.
    location /api/auth/ {
        limit_req zone=auth_zone burst=20 nodelay;
        proxy_pass http://backend_upstream;
    }

    # ASP.NET Google OAuth middleware receives the provider callback here before
    # redirecting to /api/auth/google-callback. Rate-limited too.
    location /signin-google {
        limit_req zone=auth_zone burst=20 nodelay;
        proxy_pass http://backend_upstream;
    }

    # Payment & webhook endpoints
    # SePay webhook — must go to publicapi (SepayWebhookController only exists there)
    location = /api/payment/sepay-webhook {
        proxy_pass http://publicapi_upstream;
    }

    # All other payment endpoints → backend (requires auth)
    location /api/payment/ {
        proxy_pass http://backend_upstream;
    }

    # Site-content — admin paths always → backend (auth required)
    location ^~ /api/site-content/admin {
        proxy_pass http://backend_upstream;
    }

    # ══════════════════════════════════════════════════════
    #  Method-split routing (GET → publicapi, write → backend)
    #  Uses limit_except instead of `if ($request_method = …)`.
    # ══════════════════════════════════════════════════════

    # /api/site-content — GET public read, write → admin
    location /api/site-content {
        # Write methods + non-GET (POST/PUT/DELETE/PATCH) → private backend.
        limit_except GET HEAD OPTIONS {
            proxy_pass http://backend_upstream;
        }

        # OPTIONS preflight: short-circuit at nginx for CORS-aware clients.
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  $http_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Max-Age 86400 always;
            return 204;
        }

        # GET/HEAD → publicapi (anonymous read).
        proxy_pass http://publicapi_upstream;
    }

    # /api/cancellation-policies — GET public read, write → admin
    location = /api/cancellation-policies {
        limit_except GET HEAD OPTIONS {
            proxy_pass http://backend_upstream;
        }

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  $http_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Max-Age 86400 always;
            return 204;
        }

        rewrite ^ /api/public/cancellation-policies break;
        proxy_pass http://publicapi_upstream;
    }

    # /api/deposit-policies — GET public read, write → admin
    location = /api/deposit-policies {
        limit_except GET HEAD OPTIONS {
            proxy_pass http://backend_upstream;
        }

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  $http_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Max-Age 86400 always;
            return 204;
        }

        rewrite ^ /api/public/deposit-policies break;
        proxy_pass http://publicapi_upstream;
    }

    # /api/pricing-policies — GET public read, write → admin
    location = /api/pricing-policies {
        limit_except GET HEAD OPTIONS {
            proxy_pass http://backend_upstream;
        }

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  $http_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Max-Age 86400 always;
            return 204;
        }

        rewrite ^ /api/public/pricing-policies break;
        proxy_pass http://publicapi_upstream;
    }

    # ══════════════════════════════════════════════════════
    #  Backend Api routes (private, JWT required)
    # ══════════════════════════════════════════════════════

    # Customer-facing private endpoints
    location /api/customer/ {
        proxy_pass http://backend_upstream;
    }

    # SignalR / WebSocket hub — needs upgrade headers
    location /hubs/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    # SignalR / WebSocket hub — needs upgrade headers
    location /api/hubs/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    # Catch-all for remaining /api/* → private backend
    location /api/ {
        proxy_pass http://backend_upstream;
    }

    # ══════════════════════════════════════════════════════
    #  Frontend (Next.js) — single catch-all
    # ══════════════════════════════════════════════════════
    location / {
        proxy_pass http://frontend_upstream;
    }
}
