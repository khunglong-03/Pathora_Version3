# ───────────────────────────────────────────────────────────
# Pathora Nginx — global directives (rate-limit, gzip, log format)
# Loaded via /etc/nginx/conf.d/*.conf alongside default.conf.
# ───────────────────────────────────────────────────────────

# Rate-limit zone for auth endpoints — 10 req/s per IP, 10 MB state.
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/s;
limit_req_status 429;

# Rate-limit zone for newsletter subscription — 5 req/m per IP, 10 MB state.
limit_req_zone $binary_remote_addr zone=newsletter_zone:10m rate=5r/m;

# Gzip — JSON-heavy API + Next.js JS/CSS payloads.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_min_length 256;
gzip_comp_level 5;
gzip_types
    application/json
    application/javascript
    application/xml
    application/xml+rss
    application/wasm
    text/css
    text/javascript
    text/plain
    text/xml
    image/svg+xml;

# Structured JSON access log — one JSON object per line, shipped via stdout.
log_format json_combined escape=json
    '{'
    '"time":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"method":"$request_method",'
    '"uri":"$request_uri",'
    '"status":$status,'
    '"bytes_sent":$bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_addr":"$upstream_addr",'
    '"upstream_response_time":"$upstream_response_time",'
    '"upstream_status":"$upstream_status",'
    '"referer":"$http_referer",'
    '"user_agent":"$http_user_agent",'
    '"x_forwarded_for":"$http_x_forwarded_for"'
    '}';

# Cancel the default `access_log /var/log/nginx/access.log main;` that ships
# in the base image's nginx.conf — the server block in default.conf re-enables
# logging with json_combined. This guarantees one JSON line per request.
access_log off;
error_log  /dev/stderr warn;
