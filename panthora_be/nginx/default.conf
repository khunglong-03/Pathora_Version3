# ───────────────────────────────────────────────────────────
# Pathora Nginx Reverse Proxy (backend-only compose)
# ───────────────────────────────────────────────────────────
# Used by: panthora_be/docker-compose.yml
# ───────────────────────────────────────────────────────────

upstream backend_upstream {
    server api:8080;
}

upstream publicapi_upstream {
    server publicapi:8081;
}

upstream frontend_upstream {
    server frontend:3003;
}

server {
    listen 80;
    server_name localhost;

    # ── Global proxy headers ──────────────────────────────
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── Health-check endpoints per upstream ────────────────
    location /health/api {
        proxy_pass http://backend_upstream/health;
    }

    location /health/public {
        proxy_pass http://publicapi_upstream/health;
    }

    # ══════════════════════════════════════════════════════
    #  PublicApi routes (public, no JWT required)
    # ══════════════════════════════════════════════════════

    location /api/public/ {
        proxy_pass http://publicapi_upstream;
    }

    location /api/auth/ {
        proxy_pass http://publicapi_upstream;
    }

    location /api/payment/ {
        proxy_pass http://publicapi_upstream;
    }

    location /api/site-content/ {
        proxy_pass http://publicapi_upstream;
    }

    # ══════════════════════════════════════════════════════
    #  Backend Api routes (private, JWT required)
    # ══════════════════════════════════════════════════════

    location /api/customer/ {
        proxy_pass http://backend_upstream;
    }

    # SignalR / WebSocket hub
    location /api/hubs/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    # Catch-all for remaining /api/* → private backend
    location /api/ {
        proxy_pass http://backend_upstream;
    }

    # ══════════════════════════════════════════════════════
    #  Frontend (Next.js)
    # ══════════════════════════════════════════════════════
    location / {
        proxy_pass http://frontend_upstream;
    }
}
