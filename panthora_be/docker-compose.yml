  #     retries: 5
  #     start_period: 5s
  #   restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: src/Api/Dockerfile
    container_name: panthora-api
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  publicapi:
    build:
      context: .
      dockerfile: src/PublicApi/ApiPublic/Dockerfile
    container_name: panthora-publicapi
    ports:
      - "8081:8080"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: panthora-nginx
    ports:
      # Host 8080 is used by api; use 9080 → nginx 8080
      - "9080:8080"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api
      - publicapi
      - frontend
    restart: unless-stopped

  frontend:
    build:
      context: ../pathora/frontend
      dockerfile: Dockerfile
    container_name: panthora-frontend
    ports:
      - "3003:3003"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
