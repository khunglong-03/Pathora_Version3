<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Yêu cầu hủy đặt chỗ được chấp thuận</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333;">
    <div style="max-width: 600px; margin: 0 auto; padding: 20px;">
        <h2>Xin chào {{ customer_name }},</h2>
        <p>Yêu cầu hủy đặt chỗ của bạn cho tour <strong>{{ tour_name }}</strong> (Mã: {{ booking_id }}) đã được chấp thuận.</p>
        
        <div style="background-color: #f8f9fa; padding: 15px; border-left: 4px solid #28a745; margin: 20px 0;">
            <strong>Số tiền được hoàn:</strong><br />
            {{ refund_amount }}
        </div>
        
        <p>Quá trình hoàn tiền có thể mất một vài ngày làm việc. Cảm ơn bạn đã sử dụng dịch vụ của Pathora.</p>
        <p>Trân trọng,<br />Đội ngũ Pathora</p>
    </div>
</body>
</html>
