# ───────────────────────────────────────────────────────────
# Dev-only overlay — host port publishes for local debugging.
#
# Renamed from `docker-compose.override.yml` so Compose does NOT auto-load
# this file on production (Dokploy / CI). Dev usage:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# Production deploy (Dokploy, Traefik) uses ONLY the base file:
#
#   docker compose -f docker-compose.yml up -d
#
# In production, Traefik routes traffic into `pathora-nginx:8080` via the
# external `pathora-shared-network` — no host port publish needed.
# ───────────────────────────────────────────────────────────

services:
  nginx:
    ports:
      # Local prod-style ingress on http://localhost/ (no Traefik).
      - "80:8080"
      # Legacy debug port kept for muscle memory.
      - "8099:8080"

  frontend:
    ports:
      # Publish FE directly for hot-reload debugging without going through nginx.
      - "3003:3003"

  backend:
    ports:
      # Expose backend for direct API debugging (Postman, Swagger UI).
      - "8088:8080"

  publicapi:
    ports:
      # Expose publicapi for direct API debugging.
      - "8089:8081"
