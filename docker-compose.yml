name: huynq-pathora-v2

x-frontend-remote-image-hosts: &frontend-remote-image-hosts "${NEXT_PUBLIC_REMOTE_IMAGE_HOSTS}"

# ── Shared backend environment ────────────────────────────────
x-backend-env: &backend-env
  ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT}"
  Auth__DisableAuthorization: "${Auth__DisableAuthorization:-false}"
  Dev__EnableDevEndpoints: "${Dev__EnableDevEndpoints:-false}"
  Dev__ResetAndReseedOnStartup: "${Dev__ResetAndReseedOnStartup:-false}"
  Serilog__MinimumLevel__Default: "${Serilog__MinimumLevel__Default}"
  
  # Quan trọng: Đảm bảo các biến domain trỏ đúng về V2
  Cors__AllowedOrigins__0: "https://cbbo-g99.io.vn"
  AppConfig__FrontendBaseUrl: "https://cbbo-g99.io.vn"
  
  ConnectionStrings__Default: "${ConnectionStrings__Default}"
  Redis__ConnectionString: "${Redis__ConnectionString}"
  
  Jwt__Secret: "${Jwt__Secret}"
  Jwt__Issuer: "https://cbbo-g99.io.vn"
  Jwt__Audience: "https://cbbo-g99.io.vn"
  
  # Cloudinary & Mail & Other APIs (giữ nguyên từ .env)
  Cloudinary__CloudName: "${Cloudinary__CloudName}"
  Cloudinary__ApiKey: "${Cloudinary__ApiKey}"
  Cloudinary__ApiSecret: "${Cloudinary__ApiSecret}"
  Mail__Host: "${Mail__Host}"
  Mail__Port: "${Mail__Port}"
  Mail__UserName: "${Mail__UserName}"
  Mail__Password: "${Mail__Password}"

services:
  # ════════════════════════════════════════════════════════
  #  Nginx — Entry point cho bộ V2
  # ════════════════════════════════════════════════════════
  huynq-test-nginx:
    container_name: huynq-test-nginx
    image: nginx:alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "80"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.huynq-v2-router.rule=Host(`cbbo-g99.io.vn`)"
      - "traefik.http.routers.huynq-v2-router.entrypoints=websecure"
      - "traefik.http.routers.huynq-v2-router.tls.certresolver=letsencrypt"
      - "traefik.http.services.huynq-v2-service.loadbalancer.server.port=80"
    depends_on:
      huynq-test-be:
        condition: service_healthy
      huynq-test-publicapi:
        condition: service_healthy
      huynq-test-fe:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
      - dokploy-network

  # ════════════════════════════════════════════════════════
  #  Backend — Private Api (Admin/Dashboard)
  # ════════════════════════════════════════════════════════
  huynq-test-be:
    container_name: huynq-test-be
    build:
      context: ./panthora_be
      dockerfile: src/Api/Dockerfile
    environment:
      <<: *backend-env
      ASPNETCORE_URLS: "http://+:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - default

  # ════════════════════════════════════════════════════════
  #  Backend — Public Api (Auth/Public/Payment)
  # ════════════════════════════════════════════════════════
  huynq-test-publicapi:
    container_name: huynq-test-publicapi
    build:
      context: ./panthora_be
      dockerfile: src/PublicApi/ApiPublic/Dockerfile
    environment:
      <<: *backend-env
      ASPNETCORE_URLS: "http://+:8081"
    depends_on:
      huynq-test-be:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health/live"]
      interval: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - default

  # ════════════════════════════════════════════════════════
  #  Frontend — Next.js SSR
  # ════════════════════════════════════════════════════════
  huynq-test-fe:
    container_name: huynq-test-fe
    build:
      context: ./pathora/frontend
      dockerfile: Dockerfile
      args:
        # Ép Next.js dùng relative path để tránh lỗi CORS domain cũ
        NEXT_PUBLIC_API_GATEWAY: "" 
        NEXT_PUBLIC_REMOTE_IMAGE_HOSTS: *frontend-remote-image-hosts
        NEXT_PUBLIC_IMAGES_UNOPTIMIZED: "${NEXT_PUBLIC_IMAGES_UNOPTIMIZED}"
    environment:
      NODE_ENV: "production"
      NEXT_PUBLIC_API_GATEWAY: "" 
      INTERNAL_API_URL: "http://huynq-test-be:8080"
    expose:
      - "3003"
    depends_on:
      huynq-test-be:
        condition: service_healthy
      huynq-test-publicapi:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3003"]
      interval: 15s
    restart: unless-stopped
    networks:
      - default

networks:
  default:
    driver: bridge
  dokploy-network:
    external: true